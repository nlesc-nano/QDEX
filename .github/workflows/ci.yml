name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests and CdSe regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    env:
      OMP_NUM_THREADS: "2"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: .github/ci-environment.yml
          cache-environment: true

      - name: Build the libint extension
        run: python setup.py build_ext --inplace

      - name: Unit tests
        run: python -m pytest tests -q --ignore=tests/test_cdse_integration.py --ignore=tests/test_cdse_regression.py

      - name: CdSe regression (1.2 nm validation numbers)
        env:
          QDEX_RUN_REGRESSION: "1"
        run: python -m pytest tests/test_cdse_regression.py -v

  docs:
    name: Documentation (sphinx -W)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Build
        run: python -m sphinx -W -b html docs docs/_build/html
