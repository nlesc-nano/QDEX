# Experimental first-exciton (1S) energy against quantum-dot diameter.
#
# Used by benchmarks/compare_models.py --exp-ref <name>.  The diameter of a
# computed cluster is its SAXS-equivalent diameter (qdex.cluster_size: Debye intensity of the
# inorganic atoms fitted with a sphere form factor; ligands made of H, C, N, O, P are invisible),
# unless --exp-diameter is given. The formula-unit volume diameter (6 N_fu V_fu / pi)^(1/3) is
# reported beside it; the convex hull of the atom centres gives a smaller value.
#
# Supported kinds
#   table          points: [[d_nm, E_eV], ...]; linear interpolation in 1/d^2,
#                  no extrapolation outside the table.
#   inverse_poly   E = E_g + 1 / (sum_k c_k d^k), d in nm; coefficients c_k
#                  listed from k = 0 upward.
#   aubert_hens    E1 = 1/2 [E0 + sqrt(E0^2 + 8 E0 alpha pi^2 Ry a0 / (eps_inf d_fit)
#                  * exp(-d/d_fit) / (1 - exp(-d/d_fit))^2)]   (Aubert et al. 2022, Eq. 10)
#   yu2003         Yu, Qu, Guo, Peng, Chem. Mater. 15, 2854 (2003):
#                  D(nm) = 1.6122e-9 L^4 - 2.6575e-6 L^3 + 1.6242e-3 L^2
#                          - 0.4277 L + 41.57, L = 1S wavelength in nm;
#                  inverted numerically, valid for L ~ 450-650 nm (D >~ 1.9 nm).
#
# tolerance_ev is the half-width of the window used for the PASS/WARN check.

aubert-hens-2022-zb:
  citation: "T. Aubert et al. (Z. Hens), Nano Lett. 22, 1778 (2022), Eq. 10, zinc blende CdSe (Table 1)"
  kind: aubert_hens
  e0_ev: 1.660        # bulk optical gap E_g - E_ex = 1.675 - 0.015
  d_fit_nm: 7.7       # refined Bohr diameter (SAXS data set, d = 2.9-4.8 nm)
  eps_inf: 6.2
  alpha: 0.7
  tolerance_ev: 0.10
  data_range_nm: [2.88, 4.77]

aubert-hens-2022-wz:
  citation: "T. Aubert et al. (Z. Hens), Nano Lett. 22, 1778 (2022), Eq. 10, wurtzite CdSe (Table 1)"
  kind: aubert_hens
  e0_ev: 1.736        # 1.751 - 0.015
  d_fit_nm: 5.4
  eps_inf: 6.2
  alpha: 0.7
  tolerance_ev: 0.10
  data_range_nm: [2.65, 5.05]

aubert-hens-2022-cdse:
  citation: "T. Aubert et al. (Z. Hens), Nano Lett. 22, 1778 (2022), Eq. 10, all CdSe (Table 1)"
  kind: aubert_hens
  e0_ev: 1.698        # 1.713 - 0.015, average of zb and wz
  d_fit_nm: 6.8
  eps_inf: 6.2
  alpha: 0.7
  tolerance_ev: 0.10

yu-2003:
  citation: "W. W. Yu, L. Qu, W. Guo, X. Peng, Chem. Mater. 15, 2854 (2003)"
  kind: yu2003
  tolerance_ev: 0.10

akkerman-2022-cspbbr3:
  citation: "Q. A. Akkerman et al. (M. V. Kovalenko), Science 377, 1406 (2022), Fig. 4D: first excitonic
    absorption peak (1s-1s, room temperature) of purified, lecithin-capped spheroidal CsPbBr3 QDs against
    their mean diameter (15 sizes; two overlap at ~10.5 nm). Points digitised from the published figure
    (axis calibration on the tick marks, marker centroids; about +-0.005 eV and +-0.05 nm)."
  kind: table
  points: [[3.05, 2.805], [3.75, 2.729], [4.35, 2.653], [4.82, 2.585], [5.85, 2.524], [6.19, 2.527],
           [6.91, 2.481], [7.33, 2.477], [7.82, 2.462], [8.68, 2.448], [8.83, 2.447], [10.38, 2.429],
           [10.59, 2.430], [10.74, 2.431]]
  tolerance_ev: 0.10
  data_range_nm: [3.05, 10.74]
