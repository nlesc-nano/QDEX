system:
  mo_file: "MOs_cleaned_20ang.txt"
  xyz: "geom.xyz"
  basis_txt: "BASIS_MOLOPT_UZH"
  basis_name: "DZVP-MOLOPT-PBE-GTH"
  material: "CDSE"
  gth_file: "GTH_SOC_POTENTIALS.txt"
  nthreads: 12

environment:
  eps_out: 1.0                  # vacuum; toluene 2.24

quasiparticles:
  model: "sgw-resta"            # Delta-COHSEX on the Resta Delta-W; sgw-dim, evgw-*, qsgw-*, none, brus, pbe
  # z: derived                  # plasmon-pole Z of the same dielectric model (default)
  # anchor_residual: on         # calibrated evGW@PBE0 residual (default)

integrals:
  representation: "mnok"        # mnok (atom pairs) or xs (ZDO AO density pairs)
  charges: "mulliken"           # mulliken or lowdin

excitations:
  mode: "bse"                   # bse, sbse, diagonal_bse, diagonal_sbse, independent_qp, independent_dft
  # kernel: set by the QP model (qp for Resta/DIM)
  nhomos: 25
  nlumos: 25
  full_diag: true

soc:
  enabled: true
  window: 10.0                  # eV window around the Fermi level for full SOC mixing

analysis:
  run_fuzzy: false
  cif: "CdSe_zb.cif"            # used for automated K-path generation
  pdos_atoms: ["Cd", "Se", "Cl"]
  coop_pairs: ["Cd-Se", "Cd-Cd", "Se-Se"]
  fuzzy_sigma: 0.01
  pdos_sigma: 0.08
  ewin: [-5.0, 5.0]

output:
  cube: false
  cube_spacing: 0.5
  sigma: 0.03
  plot: true
  write_csv: true
  csv_roots: 200
  time: 10.0
  save_xia: true
